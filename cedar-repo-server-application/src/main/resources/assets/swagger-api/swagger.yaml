      security:
      - api_key: []
      summary: Resolve a template identifier
      tags:
      - Templates
components:
  securitySchemes:
    api_key:
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
      in: header
      name: Authorization
      type: apiKey
