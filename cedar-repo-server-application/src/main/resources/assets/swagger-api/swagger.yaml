        \ the caller needs the template read permission, and then read access to this\
        \ particular artifact as the workspace records it. Mongo's internal `_id`\
        \ is removed before the artifact is returned."
      operationId: findTemplate
      parameters:
      - description: "The bare identifier ending the artifact's IRI, not the whole\
          \ IRI. Example: 8bc64ab5-df6b-48c8-8c61-6c016245918e"
