# Base OpenAPI document merged into the generated spec by io.swagger.core.v3:swagger-maven-plugin.
# It seeds the info block (version stamped from the POM via resource filtering) and the api_key
# security scheme that every resource class references with @SecurityRequirement(name = "api_key").
openapi: 3.0.1
info:
  title: CEDAR Repo Server API
  description: |
    Better Metadata - Better Science

    Folders and artifacts use type-qualified selectors: `folders/<uuid>`, `templates/<uuid>`,
    `template-elements/<uuid>`, `template-fields/<uuid>`, or `template-instances/<uuid>`.
    Typed routes include the type once, for example `/templates/<uuid>`. Query parameters and
    command-body selectors retain the type, including folder parameters. Percent-encoded full
    IRIs remain accepted for compatibility. Stored document identities and references remain
    full IRIs; legacy repository hosts must remain absolute until their data is migrated.

    The repo server resolves CEDAR artifact identifiers. An artifact's `@id` is an IRI under this
    server, and dereferencing that IRI returns the stored artifact, so every path here takes the
    bare identifier that ends the IRI rather than the whole IRI.

    It is read-only, and it is the one artifact read path that checks the workspace's per-artifact
    permissions rather than the caller's role alone. Writes, listings, and validation belong to the
    artifact server.
  version: ${project.version}
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
